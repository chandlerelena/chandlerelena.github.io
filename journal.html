<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  const savedTheme = localStorage.getItem("theme");
  const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;

  if (
    savedTheme === "dark" ||
    (!savedTheme && prefersDark)
  ) {
    document.documentElement.classList.add("dark-mode");
  }
</script>

<script>
  try {
    const savedLanguage =
      localStorage.getItem("language") || "en";

    document.documentElement.setAttribute(
      "data-language",
      savedLanguage
    );
  } catch (error) {
    document.documentElement.setAttribute(
      "data-language",
      "en"
    );
  }
</script>
  
  <title>Journal</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <header class="site-header">
    <a href="index.html" class="site-title">
      <span class="site-name">CHANDLER ELENA</span>
      <span class="site-name-ja">チャンドラ エレナ</span>
    </a>

    <nav class="site-nav">
      <a href="index.html" data-en="Work" data-ja="作品集">Work</a>
      <a href="journal.html" data-en="Journal" data-ja="ブログ">Journal</a>
      <a href="about.html" data-en="About" data-ja="私について">About</a>

      <button
        class="language-toggle"
        type="button"
        aria-label="Switch to Japanese"
      >
        EN / 日本語
      </button>

      <button
        class="theme-toggle"
        type="button"
        aria-label="Switch to dark mode"
      >
        ☾
      </button>
    </nav>
    
  </header>


  <main class="coming-soon">

    <p>Journal coming soon.</p>

  </main>


  <footer class="site-footer">
    <p>© 2026 Chandler Elena</p>
  </footer>

  <script src="js/theme.js"></script>
  <script src="js/language.js"></script>
</body>
</html>
