<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Chandler Elena Photography</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <header class="site-header">
    <a href="index.html" class="site-title">
      YOUR NAME
    </a>

    <nav class="site-nav">
      <a href="index.html">Work</a>
      <a href="journal.html">Journal</a>
      <a href="about.html">About</a>
    </nav>
  </header>


  <main class="season-grid">

    <a
      href="galleries/spring.html"
      class="season-card slideshow"
      data-season="spring"
      data-interval="8000"
    >
      <img class="slide slide-a" alt="Spring photography">
      <img class="slide slide-b" alt="Spring photography">

      <div class="season-overlay">
        <span>Spring</span>
      </div>
    </a>


    <a
      href="galleries/summer.html"
      class="season-card slideshow"
      data-season="summer"
      data-interval="11000"
    >
      <img class="slide slide-a" alt="Summer photography">
      <img class="slide slide-b" alt="Summer photography">

      <div class="season-overlay">
        <span>Summer</span>
      </div>
    </a>


    <a
      href="galleries/autumn.html"
      class="season-card slideshow"
      data-season="autumn"
      data-interval="9000"
    >
      <img class="slide slide-a" alt="Autumn photography">
      <img class="slide slide-b" alt="Autumn photography">

      <div class="season-overlay">
        <span>Autumn</span>
      </div>
    </a>


    <a
      href="galleries/winter.html"
      class="season-card slideshow"
      data-season="winter"
      data-interval="13000"
    >
      <img class="slide slide-a" alt="Winter photography">
      <img class="slide slide-b" alt="Winter photography">

      <div class="season-overlay">
        <span>Winter</span>
      </div>
    </a>

  </main>


  <footer class="site-footer">
    <p>© 2026 Chandler Elena</p>
  </footer>

  <script src="js/home-slideshow.js"></script>

</body>
</html>
